<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grade Escape - App de Questões</title>
    
    <!-- Otimização Suprema: Força o telemóvel a carregar as imagens antes de abrir a tela -->
    <link rel="preload" href="assets/fundo.png" as="image">
    <link rel="preload" href="assets/Botao-Mat.png" as="image">
    <link rel="preload" href="assets/Botao-Port.png" as="image">
    <link rel="preload" href="assets/Botao-Hist.png" as="image">
    <link rel="preload" href="assets/Botao-Cien.png" as="image">

    <!-- Fontes Épicas do Jogo -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">    
    
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        
        <!-- TELA 1: MENU PRINCIPAL -->
        <div id="tela-menu" class="tela ativa">
            <h1>THE GRADE ESCAPE</h1>
            <p class="subtitulo">Banco Oficial de Questões</p>
            
            <div class="grid-materias">
                <!-- Textos removidos pois já estão nas imagens -->
                <button class="btn-materia btn-mat" onclick="sortearPergunta('Matemática')"></button>
                <button class="btn-materia btn-port" onclick="sortearPergunta('Português')"></button>
                <button class="btn-materia btn-hist" onclick="sortearPergunta('História')"></button>
                <button class="btn-materia btn-cien" onclick="sortearPergunta('Ciências')"></button>
            </div>

                        <!-- Botão para entrar no submenu do Desafio -->
            <button class="btn-acao" style="margin-top: 20px; width: 100%; background-color: #D32F2F; color: white;" onclick="abrirMenuDesafio()">
                ⚔️ MODO DESAFIO (2 JOGADORES)
            </button>


        </div>




        <!-- TELA 2: PERGUNTA -->
        <div id="tela-pergunta" class="tela">
            <div class="cabecalho-pergunta">
                <span id="nome-materia">Matemática</span>
                <!-- Novo Cronômetro -->
                <span id="tempo-restante">⏱️ 45s</span>
                <span id="pontos-materia" class="pontos-badge">3 PTS</span>
            </div>

            <p id="texto-pergunta">Carregando pergunta...</p>
            
            <!-- NOVO: Área do botão de dica -->
            <div style="text-align: right; margin-bottom: 15px;">
                <button id="btn-dica" class="btn-dica" onclick="usarDica()">🪄 Usar Dica</button>
            </div>

            <div id="opcoes" class="opcoes-container">
                <!-- Botões gerados pelo JS -->
            </div>
        </div>

        <!-- TELA 3: FEEDBACK -->
        <div id="tela-feedback" class="tela">
            <div id="icone-feedback">✅</div>
            <h2 id="titulo-feedback">CORRETO!</h2>
            <p id="pontos-feedback">+3 Pontos no Boletim</p>
            <p id="explicacao-feedback">A explicação vai aqui.</p>
            
            <!-- Nova Tag para o ID da Questão -->
            <p id="referencia-pergunta" style="font-size: 0.9rem; color: #B0BEC5; margin-bottom: 20px; font-family: sans-serif;">Ref: ID</p>
            
            <button class="btn-acao" onclick="voltarMenu()">ESCOLHER OUTRA MATÉRIA</button>
        </div>


                <!-- TELA 4: ARENA DO DESAFIO (DIVIDIDA) -->
        <div id="tela-desafio" class="tela">
            
            <!-- METADE DO JOGADOR 2 (TOPO - VIRADA DE CABEÇA PARA BAIXO) -->
            <div id="area-j2" class="metade-desafio neutra" onclick="iniciarDesafio(1)">
                <div class="relogio-gigante" id="relogio-j2">40</div>
                
                <div class="conteudo-desafio">
                    <p id="pergunta-j2" class="texto-pergunta-desafio"></p>
                    <div id="opcoes-j2" class="opcoes-container-desafio"></div>
                    <div class="alerta-penalidade" id="alerta-j2">-5s</div>
                </div>
                
                <div class="overlay-espera" id="overlay-j2">
                    <div class="id-jogador">JOGADOR 2</div>
                    <span>APERTE PARA COMEÇAR O TEMPO DO ADVERSÁRIO</span>
                </div>
            </div>

            <!-- LINHA DIVISÓRIA CENTRAL -->
            <div class="linha-divisoria"></div>

            <!-- METADE DO JOGADOR 1 (BASE - POSIÇÃO NORMAL) -->
            <div id="area-j1" class="metade-desafio neutra" onclick="iniciarDesafio(2)">
                <div class="relogio-gigante" id="relogio-j1">40</div>
                
                <div class="conteudo-desafio">
                    <p id="pergunta-j1" class="texto-pergunta-desafio"></p>
                    <div id="opcoes-j1" class="opcoes-container-desafio"></div>
                    <div class="alerta-penalidade" id="alerta-j1">-5s</div>
                </div>

                <div class="overlay-espera" id="overlay-j1">
                    <div class="id-jogador">JOGADOR 1</div>
                    <span>APERTE PARA COMEÇAR O TEMPO DO ADVERSÁRIO</span>
                </div>
            </div>

        </div>
8


    </div>

    <!-- Link para o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
